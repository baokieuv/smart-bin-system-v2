worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server_names_hash_bucket_size 64;

    # --- UPSTREAM GROUPS ---
    upstream smart_bin_cms { server 127.0.0.1:3000; }
    upstream iam_service { server 127.0.0.1:2106; }
    upstream noti_service { server 127.0.0.1:2107; }
    upstream device_service { server 127.0.0.1:2108; }
    upstream media_service { server 127.0.0.1:2109; }
    upstream smart_bin_thingsboard { server 127.0.0.1:8080; }
    upstream smart_bin_s3_api { server 127.0.0.1:9000; }
    upstream smart_bin_s3_console { server 127.0.0.1:9001; }
    upstream mqtt_ws_proxy { server 127.0.0.1:8081; }

    # --- SHARED PROXY HEADERS ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ==========================================
    # 1. FRONTEND -> cms.localhost (or just localhost)
    # ==========================================
    server {
        listen 80;
        server_name cms.localhost localhost;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://smart_bin_cms;
        }
    }

    # ==========================================
    # 2. BACKEND API GATEWAY -> api.localhost
    # ==========================================
    server {
        listen 80;
        server_name api.localhost;

        # Bắt lỗi 401 và 403 từ IAM trả về để format thành JSON cho Frontend dễ đọc
        error_page 401 = @error401;
        # error_page 403 = @error403;

        location @error401 {
            default_type application/json;
            return 401 '{"success": false, "code": "AVT2001", "message": "Unauthorized: Không có quyền truy cập hoặc Token không hợp lệ.", "traceId": "$request_id"}';
        }

        # location @error403 {
        #     default_type application/json;
        #     return 403 '{"success": false, "code": "AVT2009", "message": "Forbidden: Tài khoản đang chờ xác thực email hoặc chưa thiết lập mật khẩu.", "traceId": "$request_id"}';
        # }
    
        # --- IAM Service (Auth & Users) ---
        location ~ ^/api/v1/(auth|users|tenants) { 
            # 1. CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Signature,metadata,X-AI-Version,X-Bin-Version,X-Desktop-Version' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # 2. Hide backend CORS headers to prevent duplicates
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            # 3. Standard CORS Headers
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://iam_service; 
        }

        # --- Device Service ---
        location ~ ^/api/v1/(configs|device-profiles|device-groups|devices|firmware-mappings|things-board) { 
            # 1. CORS Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Signature,metadata,X-AI-Version,X-Bin-Version,X-Desktop-Version' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            # 2. Hide backend CORS headers to prevent duplicates
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            # 3. Standard CORS Headers
            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://device_service; 
        }

        # --- Media Service ---
        location ~ ^/api/v1/(media|internal|stream) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '$http_origin' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Signature,metadata,X-AI-Version,X-Bin-Version,X-Desktop-Version' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            add_header 'Access-Control-Allow-Origin' '$http_origin' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            client_max_body_size 10M; 
            proxy_pass http://media_service;
        }

        # --- Notification Service ---
        location /api/v1/notifications {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://noti_service;
        }

        # Mặc định trả về 404 nếu không khớp service nào
        location / {
            return 404 "Service Not Found";
        }
    }

    # ==========================================
    # 3. THINGSBOARD (IoT) -> thingsboard.localhost
    # ==========================================
    server {
        listen 80;
        server_name thingsboard.localhost;

        # Chỉ cho phép gửi Telemetry từ thiết bị
        location ~ ^/api/v1/[a-zA-Z0-9_-]+/telemetry$ {
            proxy_pass http://smart_bin_thingsboard;
        }

        location /mqtt {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Sec-WebSocket-Protocol "";
            add_header Sec-WebSocket-Protocol "mqtt" always;
            proxy_pass http://mqtt_ws_proxy;
        }

        location / {
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Trỏ về upstream của ThingsBoard
            proxy_pass http://smart_bin_thingsboard;
        }
    }

    # ==========================================
    # 4. MINIO S3 -> minio.localhost
    # ==========================================
    server {
        listen 80;
        server_name minio.localhost;

        location / {
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            client_max_body_size 100M;
            proxy_pass http://smart_bin_s3_console;
        }
    }

    # ==========================================
    # 4.2 MINIO S3 API -> s3.localhost
    # ==========================================
    server {
        listen 80;
        server_name s3.localhost;

        ignore_invalid_headers off;
        client_max_body_size 100M;
        proxy_buffering off;

        location / {
            proxy_set_header Host $http_host; 
            proxy_pass http://smart_bin_s3_api;
        }
    }
}