worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    server_names_hash_bucket_size 64;

    # --- UPSTREAM GROUPS ---
    upstream smart_bin_cms { server 127.0.0.1:3000; }
    upstream iam_service { server 127.0.0.1:2106; }
    upstream noti_service { server 127.0.0.1:2107; }
    upstream device_service { server 127.0.0.1:2108; }
    upstream media_service { server 127.0.0.1:2109; }
    upstream smart_bin_thingsboard { server 127.0.0.1:8080; }
    upstream smart_bin_s3_api { server 127.0.0.1:9000; }
    upstream smart_bin_s3_console { server 127.0.0.1:9001; }
    upstream mqtt_ws_proxy { server 127.0.0.1:8081; }

    # --- SHARED PROXY HEADERS ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ==========================================
    # 1. MAIN APP: FRONTEND & API GATEWAY (Port 80)
    # Truy cập Web: http://localhost
    # Gọi API từ NextJS: http://localhost/api/v1/...
    # ==========================================
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # --- Bắt lỗi 401 và 403 từ IAM ---
        error_page 401 = @error401;
        error_page 403 = @error403;
        location @error401 {
            default_type application/json;
            return 401 '{"success": false, "code": "AVT2001", "message": "Unauthorized", "traceId": "$request_id"}';
        }
        location @error403 {
            default_type application/json;
            return 403 '{"success": false, "code": "AVT2009", "message": "Forbidden", "traceId": "$request_id"}';
        }

    
        # 1. IAM Service (Auth, Users, Tenants)
        location ~ ^/api/v1/(auth|users|tenants) {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }
            # Header cho các request thành công
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            proxy_pass http://iam_service;
        }

        # 2. Device Service
        location ~ ^/api/v1/(configs|device-profiles|device-groups|devices|firmware-mappings|things-board) {
	    client_max_body_size 10M;
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            proxy_pass http://device_service;
        }

        # 3. Media Service
        location ~ ^/api/v1/media {
            client_max_body_size 10M;
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            proxy_pass http://media_service;
        }

        # 4. Notification Service (WebSocket Support)
        location ^~ /api/v1/notifications {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            #proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
                add_header 'Content-Length' 0;
                return 204;
            }
            add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
            proxy_pass http://noti_service;
        }

        # 5. FRONTEND ROUTE (Mặc định nếu không chứa /api/ thì nhảy vào Web CMS)
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://smart_bin_cms;
        }
    }

    # ==========================================
    # 2. THINGSBOARD (Đổi sang Port 8082)
    # Truy cập: http://localhost:8082
    # ==========================================
    server {
        listen 8082;
        server_name localhost 127.0.0.1;

        location ~ ^/api/v1/[a-zA-Z0-9_-]+/telemetry$ {
            proxy_pass http://smart_bin_thingsboard;
        }

        location /mqtt {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            add_header Sec-WebSocket-Protocol "mqtt" always;
            proxy_pass http://mqtt_ws_proxy;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://smart_bin_thingsboard;
        }
    }

    # ==========================================
    # 3. MINIO S3 CONSOLE
    # Truy cập: http://localhost:9001
    # ==========================================
    server {
        listen 9004;
        server_name localhost 127.0.0.1;

        location / {
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            client_max_body_size 100M;
            proxy_pass http://smart_bin_s3_console;
        }
    }

    # ==========================================
    # 4. MINIO S3 API
    # ==========================================
    server {
        listen 9003;
        server_name localhost 127.0.0.1;

        ignore_invalid_headers off;
        client_max_body_size 100M;
        proxy_buffering off;

        location / {
            proxy_set_header Host $http_host; 
            proxy_pass http://smart_bin_s3_api;
        }
    }
}