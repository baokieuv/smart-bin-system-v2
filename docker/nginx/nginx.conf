worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    server_names_hash_bucket_size 64;

    # --- UPSTREAM GROUPS ---
    # upstream smart_bin_fe { server frontend:3000; }
    upstream smart_bin_cms { server cms:3000; }
    
    upstream iam_service { server iam-service:8080; }
    upstream noti_service { server noti-service:8080; }
    upstream device_service { server device-service:8080; }
    upstream media_service { server media-service:8080; }
    
    upstream smart_bin_thingsboard { server thingsboard-ce:8080; }
    upstream smart_bin_s3_api { server minio:9000; }
    upstream smart_bin_s3_console { server minio:9001; }
    upstream mqtt_ws_proxy { server mqtt-ws-proxy:8081; }

    # --- SHARED PROXY HEADERS ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # ==========================================
    # 1. FRONTEND -> kvbhust.id.vn
    # ==========================================
    server {
        listen 80;
        server_name kvbhust.id.vn;

        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_pass http://smart_bin_cms;
        }
    }

    # server {
    #     listen 80;
    #     server_name cms.kvbhust.id.vn;

    #     location / {
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #         proxy_pass http://smart_bin_cms;
    #     }
    # }

    # ==========================================
    # 2. BACKEND API GATEWAY -> api.kvbhust.id.vn
    # ==========================================
    server {
        listen 80;
        server_name api.kvbhust.id.vn;

        # Bắt lỗi 401 và 403 từ IAM trả về để format thành JSON cho Frontend dễ đọc
        error_page 401 = @error401;
        error_page 403 = @error403;

        location @error401 {
            default_type application/json;
            return 401 '{"success": false, "code": "AVT2001", "message": "Unauthorized: Không có quyền truy cập hoặc Token không hợp lệ.", "traceId": "$request_id"}';
        }

        location @error403 {
            default_type application/json;
            return 403 '{"success": false, "code": "AVT2009", "message": "Forbidden: Tài khoản đang chờ xác thực email hoặc chưa thiết lập mật khẩu.", "traceId": "$request_id"}';
        }
    
        # --- IAM Service (Auth & Users) ---
        location /api/v1/auth { proxy_pass http://iam_service; }
        location /api/v1/users { proxy_pass http://iam_service; }
        location /api/v1/tenants { proxy_pass http://iam_service; }

        # --- Device Service ---
        location /api/v1/configs { proxy_pass http://device_service; }
        location /api/v1/device-profiles { proxy_pass http://device_service; }
        location /api/v1/device-groups { proxy_pass http://device_service; }
        location /api/v1/devices { proxy_pass http://device_service; }
        location /api/v1/firmware-mappings { proxy_pass http://device_service; }
        location /api/v1/things-board/ { proxy_pass http://device_service; }

        # --- Media Service ---
        location /api/v1/media/internal {
            client_max_body_size 10M; 
            proxy_pass http://media_service;
        }
        location /api/v1/media/ {
            client_max_body_size 10M; 
            proxy_pass http://media_service;
        }

        # --- Notification Service ---
        location /api/v1/notifications {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://noti_service;
        }

        # Mặc định trả về 404 nếu không khớp service nào
        location / {
            return 404 "Service Not Found";
        }
    }

    # ==========================================
    # 3. THINGSBOARD (IoT) -> thingsboard.kvbhust.id.vn
    # ==========================================
    server {
        listen 80;
        server_name thingsboard.kvbhust.id.vn;

        # Chỉ cho phép gửi Telemetry từ thiết bị
        location ~ ^/api/v1/[a-zA-Z0-9_-]+/telemetry$ {
            proxy_pass http://smart_bin_thingsboard;
        }

        location /mqtt {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Sec-WebSocket-Protocol "";
            add_header Sec-WebSocket-Protocol "mqtt" always;
            proxy_pass http://mqtt_ws_proxy;
        }

        location / {
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Trỏ về upstream của ThingsBoard
            proxy_pass http://smart_bin_thingsboard;
        }
    }

    # ==========================================
    # 4. MINIO S3 -> minio.kvbhust.id.vn
    # ==========================================
    server {
        listen 80;
        server_name minio.kvbhust.id.vn;

        location / {
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            client_max_body_size 100M;
            proxy_pass http://smart_bin_s3_console;
        }
    }

    # ==========================================
    # 4.2 MINIO S3 API -> s3.kvbhust.id.vn
    # ==========================================
    server {
        listen 80;
        server_name s3.kvbhust.id.vn;

        ignore_invalid_headers off;
        client_max_body_size 100M;
        proxy_buffering off;

        location / {
            proxy_set_header Host $http_host; 
            proxy_pass http://smart_bin_s3_api;
        }
    }
}