server:
  port: ${MEDIA_SERVICE_PORT:2109}

webrtc:
  server:
    url: ${MEDIA_WEBRTC_URL:http://webrtc.localhost}

spring:
  application:
    name: media-service

  datasource:
    url: ${MEDIA_DB_URL:jdbc:mariadb://localhost:3306/smart-bin-v2}
    username: ${MEDIA_DB_USER:admin}
    password: ${MEDIA_DB_PASS:admin}
    driver-class-name: org.mariadb.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      connection-timeout: ${MEDIA_DB_POOL_TIMEOUT:20000}
      maximum-pool-size: ${MEDIA_DB_POOL_MAX:10}
      minimum-idle: ${MEDIA_DB_POOL_MIN:5}
      max-lifetime: ${MEDIA_DB_POOL_LIFETIME:1200000}
      idle-timeout: ${MEDIA_DB_POOL_IDLE_TIMEOUT:300000}
      leak-detection-threshold: ${MEDIA_DB_POOL_LEAK_THRESHOLD:60000}

  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: ${MEDIA_DB_DDL_AUTO:update}
    show-sql: ${MEDIA_DB_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${MEDIA_DB_FORMAT_SQL:true}

  servlet:
    multipart:
      enabled: ${MEDIA_MULTIPART_ENABLED:true}
      max-file-size: ${MEDIA_MAX_FILE_SIZE:5MB}
      max-request-size: ${MEDIA_MAX_REQUEST_SIZE:20MB}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/smart-bin-realm}
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/smart-bin-realm/protocol/openid-connect/certs}

minio:
  url: ${MINIO_SERVER_URL:https://s3.kvbhust.id.vn}
  bucket: ${MINIO_BUCKET:smart-bin-system}
  access_key: ${MINIO_ACCESS_KEY:minioadmin}
  secret_key: ${MINIO_SECRET_KEY:minioadmin}

media:
  max-file-size-bytes: ${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
  upload-url-expiry-minutes: ${MEDIA_UPLOAD_URL_EXPIRY_MINUTES:15}
  download-url-expiry-minutes: ${MEDIA_DOWNLOAD_URL_EXPIRY_MINUTES:15}
  allowed-mime-types: ${MEDIA_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,image/gif,application/pdf}
  internal-secret: ${MEDIA_INTERNAL_SECRET:SUPER_MEDIA_SECRET_INTERNAL_KEY}

device:
  internal-secret: ${DEVICE_INTERNAL_SECRET:SUPER_DEVICE_SECRET_INTERNAL_KEY}

app:
  device-service:
    url: ${DEVICE_SERVICE_URL:http://localhost:2108}

management:
  endpoints:
    web:
      exposure:
        include: health,info